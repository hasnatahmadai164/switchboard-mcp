name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:

      AUTH0_DOMAIN: example.us.auth0.com
      MCP_RESOURCE_SERVER_URL: http://localhost:8000
      SWITCHBOARD_DB_READONLY_USER: ci_readonly
      SWITCHBOARD_DB_READONLY_PASSWORD: ci_readonly_pw
      SWITCHBOARD_DB_WRITE_USER: ci_write
      SWITCHBOARD_DB_WRITE_PASSWORD: ci_write_pw
      PINECONE_API_KEY: ci_dummy_key
      GOOGLE_CLIENT_ID: ci_dummy_client_id
      GOOGLE_CLIENT_SECRET: ci_dummy_client_secret
      GOOGLE_REFRESH_TOKEN: ci_dummy_refresh_token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
          pip install ruff

      - name: Lint
        run: ruff check src/

      - name: Run tests
        run: pytest tests/ -v

      - name: Verify server module imports cleanly
        run: python -c "import switchboard.server"

      - name: Docker build check
        run: docker build -t switchboard-mcp:ci .
