name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src/

      - name: Verify server module imports cleanly
        env:
          AUTH0_DOMAIN: example.us.auth0.com
          MCP_RESOURCE_SERVER_URL: http://localhost:8000
        run: python -c "import sys; sys.path.insert(0, 'src'); import switchboard.server"

      - name: Docker build check
        run: docker build -t switchboard-mcp:ci .
