name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install ruff

      - name: Lint
        run: ruff check src/

      - name: Verify server module imports cleanly
        env:
          # Dummy values -- this step only proves the code constructs
          # cleanly, it never talks to real Auth0 or Postgres. Real
          # credentials are never present in CI.
          AUTH0_DOMAIN: example.us.auth0.com
          MCP_RESOURCE_SERVER_URL: http://localhost:8000
          SWITCHBOARD_DB_READONLY_USER: ci_readonly
          SWITCHBOARD_DB_READONLY_PASSWORD: ci_readonly_pw
          SWITCHBOARD_DB_WRITE_USER: ci_write
          SWITCHBOARD_DB_WRITE_PASSWORD: ci_write_pw
        run: python -c "import switchboard.server"

      - name: Docker build check
        run: docker build -t switchboard-mcp:ci .
