[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchboard-mcp"
version = "0.1.0"
description = "Remote MCP server exposing Postgres, Pinecone, Google Sheets, Gmail and Calendar as curated business tools."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
